<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col">
                <h2>Entre em contato</h2>
                <form id="form">
                    <div class="form-campo">
                        <label class="form-label" for="nome" >Seu nome</label>
                        <input class="form-control" type="text" id="nome" name="nome" placeholder="John Doe">
                    </div>
                    <div class="form-campo">
                        <label for="email" class="form-label" >Seu e-mail</label>
                        <input id="email" name="email" type="email" class="form-control" placeholder="email@exemplo.com">
                    </div>
                    <div class="form-campo">
                        <label for="tel" class="form-label">Seu Celular</label>
                        <input id="telefone" name="telefone" type="tel" class="form-control">
                    </div>
                    
                    <button type="submit" class="btn btn-success">Enviar</button>
                </form>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="text/javascript" src="https://code.jquery.com/jquery-1.11.0.min.js"></script>
    <script type="text/javascript" src="https://code.jquery.com/jquery-migrate-1.2.1.min.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.min.js"></script>
    <script src="./js/jquery.mask.min.js"></script>
    <script src="./js/jquery.validate.min.js"></script>
    <script src="./js/messages_pt_BR.min.js"></script>
    <script src="./js/main.js"></script>
    <script src="./main.js"></script>
</body>
</html>
