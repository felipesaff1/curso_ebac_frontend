<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio</title>
    <link rel="stylesheet" href="./main.css" />
</head>
<body>
    <div class="container">
        <h1>exercicio HTML JS</h1>
        <br>
        <h2>Insira numeros nas caixas abaixo, sendo a caixa A um numero menor que a B</h2>
        <form id="form-deposito">
            <input type="number" id="numero-a" required placeholder="Número A" />
            <input type="number" id="numero-b" required placeholder="Número B" />
            <p class="error-number">
               O numero B precisa ser maior que A
            </p>
            <button type="submit">Submit</button>
        </form>
        <p class="sucess-message"></p>
    </div>
    <script src="./main.js"></script>
</body>
</html>
